[project]
name = "roomlog-server"
version = "0.1.0"
description = "roomlog server: ingest, archive, transcription worker, sessions, CLI and MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1",
    "huggingface_hub>=0.30",
    "mcp>=2,<3",
    "numpy>=1.26",
]

[project.scripts]
roomlog = "roomlog_server.cli:main"
roomlog-reader = "roomlog_server.reader_http:main"
roomlog-mcp = "roomlog_server.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roomlog_server"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
