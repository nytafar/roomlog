bind = "127.0.0.1:8540"
db_path = "~/.local/share/roomlog/roomlog.db"
# Chunk audio for GET /v1/recall/audio; `chunks.path` is relative to this. Optional:
# defaults to `archive/` beside db_path, the server's own default (data_dir/archive).
# archive_dir = "~/.local/share/roomlog/archive"
tokens_file = "~/.config/roomlog-reader/tokens.toml"
static_root = "/home/lasse/services/apps/roomlog-reader/web"
# Tailscale logins read as the owner without a token, taken from the Tailscale-User-Login
# header that roomlog-tsnet-proxy.service sets (ADR 0009). Empty or absent: bearer only.
# Printable ASCII only, compared exactly. Refused at startup unless `bind` is loopback, and
# honoured only from a peer socket owned by the reader's own uid.
# tailscale_logins = ["nytafar@github"]
# Host values the identity header is honoured with (DNS-rebinding guard). Default: only
# "localhost:<bind port>", which is what tsnet-proxy sends; leave it unset. `tailscale
# serve` cannot use identity whatever this says: tailscaled runs as root, so its socket
# fails the same-uid check, and that path stays bearer-only.
# tailscale_hosts = ["localhost:8540"]
[sources.nyta]
label = "Kitchen"
display_as = "room"
