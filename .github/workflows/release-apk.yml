# Build the Android APK and attach it to a GitHub release.
#
# Trigger: push a tag `v<version>` (for example `v0.1.0`). A tag with a suffix after a dash
# (`v0.1.0-rc1`) becomes a prerelease. Manual runs from the Actions tab build the APK and keep
# it as a workflow artifact without creating a release.
#
# Signing: if the repository secrets ROOMLOG_KEYSTORE_BASE64, ROOMLOG_KEYSTORE_PASSWORD,
# ROOMLOG_KEY_ALIAS and ROOMLOG_KEY_PASSWORD exist, the APK is signed with that key. Otherwise
# it is debug-signed, which is fine for sideloading but means a later signed build cannot be
# installed over it without uninstalling first.

name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      ROOMLOG_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-run{0}', github.run_number) }}
      ROOMLOG_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Strip the leading v from the version name
        run: echo "ROOMLOG_VERSION=${ROOMLOG_VERSION#v}" >> "$GITHUB_ENV"

      - name: Decode the release keystore when secrets are configured
        if: ${{ secrets.ROOMLOG_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ROOMLOG_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ROOMLOG_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "ROOMLOG_KEYSTORE_PASSWORD=${{ secrets.ROOMLOG_KEYSTORE_PASSWORD }}"
            echo "ROOMLOG_KEY_ALIAS=${{ secrets.ROOMLOG_KEY_ALIAS }}"
            echo "ROOMLOG_KEY_PASSWORD=${{ secrets.ROOMLOG_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Test core and build the release APK
        run: ./gradlew --no-daemon :core:test :app:assembleRelease

      - name: Name the APK
        id: apk
        run: |
          out="roomlog-android-${ROOMLOG_VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=android/$out" >> "$GITHUB_OUTPUT"
          echo "sum=android/$out.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: roomlog-android-${{ env.ROOMLOG_VERSION }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.sum }}
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.sum }}
